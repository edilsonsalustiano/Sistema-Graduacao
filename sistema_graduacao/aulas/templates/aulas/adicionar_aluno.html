{% extends 'base.html' %}

{% block content %}

<div class="dashboard-content">

    <div class="container-fluid" style="max-width: 1000px;">

        <div class="dashboard-card">

            <div class="mb-4">
                <h2 class="fw-bold text-white">
                    Adicionar Aluno
                </h2>

                <p class="text-secondary mb-0">
                    Escolha o aluno que vai participar da turma {{ aula.turma }}.
                </p>
            </div>

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <div class="col-md-12 mb-3">
                        <label class="form-label">Aluno</label>
                        {{ form.aluno }}
                        {{ form.aluno.errors }}
                    </div>

                </div>

                <hr class="border-secondary my-4">

                <div class="d-flex justify-content-end gap-2">

                    <a href="{% url 'detalhe_aula' aula.pk %}"
                       class="btn btn-outline-light px-4">
                        Voltar
                    </a>

                    <button class="btn btn-success px-4">
                        Adicionar
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<style>

.dashboard-card{
    background: rgba(30,41,59,.85);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    padding: 25px 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.text-secondary{
    color:#94a3b8 !important;
}

.form-label{
    color:#fff;
    font-weight:600;
    margin-bottom:8px;
}

select{
    width:100%;
    min-height:45px;
    padding:10px 14px;
    background:#1e293b !important;
    border:1px solid #334155 !important;
    color:#fff !important;
    border-radius:12px !important;
}

select:focus{
    border-color:#10b981 !important;
    box-shadow:0 0 0 .2rem rgba(16,185,129,.25) !important;
}

select option{
    background:#1e293b;
    color:#fff;
}

.errorlist{
    color:#f87171;
    list-style:none;
    padding:0;
    margin:4px 0 0;
    font-size:13px;
}

</style>

{% endblock %}
