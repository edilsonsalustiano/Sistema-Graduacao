{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="icon" type="image/png" href="{% static 'alunos/logo.png' %}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at top,
        #0f172a,
        #020617);

    color:white;
}

/* CARD */

.login-card{
    width:420px;

    background:rgba(30,41,59,.90);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(12px);

    border-radius:24px;

    padding:40px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.35);

    text-align:center;
}

/* LOGO */

.logo-ct{
    width:120px;
    height:120px;

    border-radius:50%;
    object-fit:cover;

    border:4px solid rgba(255,255,255,.08);

    margin-bottom:20px;
}

/* TÍTULOS */

.titulo{
    font-size:28px;
    font-weight:700;
    color:white;
    margin-bottom:10px;
}

.subtitulo{
    color:#94a3b8;
    margin-bottom:30px;
}

/* LABELS */

label{
    color:white;
    font-weight:600;
    margin-bottom:8px;
}

/* INPUTS */

.form-control{
    background:#1e293b !important;
    border:1px solid #334155 !important;
    color:white !important;

    border-radius:12px !important;
    height:48px;
}

.form-control::placeholder{
    color:#94a3b8;
}

.form-control:focus{
    background:#1e293b !important;
    color:white !important;

    border-color:#10b981 !important;

    box-shadow:
        0 0 0 .2rem rgba(16,185,129,.20);
}

/* INPUT GROUP */

.input-group-text{
    background:#1e293b !important;
    border:1px solid #334155 !important;
    color:#94a3b8 !important;
}

.btn-outline-secondary{
    background:#1e293b !important;
    border:1px solid #334155 !important;
    color:#94a3b8 !important;
}

.btn-outline-secondary:hover{
    background:#334155 !important;
    color:white !important;
}

/* BOTÃO */

.btn-login{
    background:#10b981;
    border:none;

    height:50px;

    border-radius:12px;

    font-weight:600;
    font-size:16px;

    transition:.3s;
}

.btn-login:hover{
    background:#059669;
    transform:translateY(-2px);
}

/* ALERTA */

.alert-danger{
    background:rgba(239,68,68,.15);
    border:1px solid rgba(239,68,68,.25);
    color:#fecaca;
}

/* RESPONSIVO */

@media(max-width:500px){

    .login-card{
        width:95%;
        padding:30px 25px;
    }

    .logo-ct{
        width:100px;
        height:100px;
    }
}

</style>

</head>

<body>

<div class="login-card">

    <img src="{% static 'alunos/logo.png' %}"
         class="logo-ct"
         alt="Logo">

    <h2 class="titulo">
        Sistema de Graduação
    </h2>

    <p class="subtitulo">
        Faça login para acessar o painel
    </p>

    {% if form.errors %}
        <div class="alert alert-danger d-flex align-items-center py-2 mb-4">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            Usuário ou senha incorretos.
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="mb-3 text-start">

            <label class="form-label">
                Usuário
            </label>

            <div class="input-group">

                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Digite seu usuário"
                       required>

                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>

            </div>

        </div>

        <div class="mb-4 text-start">

            <label class="form-label">
                Senha
            </label>

            <div class="input-group">

                <input type="password"
                       name="password"
                       id="senha"
                       class="form-control"
                       placeholder="Digite sua senha"
                       required>

                <button type="button"
                        class="btn btn-outline-secondary"
                        onclick="toggleSenha()">

                    <i class="bi bi-eye" id="icone-senha"></i>

                </button>

            </div>

        </div>

        <button class="btn btn-login w-100">
            Entrar
        </button>

    </form>

</div>

<script>

function toggleSenha() {

    const senha = document.getElementById('senha');
    const icone = document.getElementById('icone-senha');

    if (senha.type === 'password') {
        senha.type = 'text';
        icone.classList.remove('bi-eye');
        icone.classList.add('bi-eye-slash');
    } else {
        senha.type = 'password';
        icone.classList.remove('bi-eye-slash');
        icone.classList.add('bi-eye');
    }
}

</script>

</body>
</html>
