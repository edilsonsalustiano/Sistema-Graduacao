{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Graduação</title>

    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        :root{
            --bg:#0f172a;
            --sidebar:#111827;
            --card:#1e293b;
            --border:#334155;
            --text:#f8fafc;
            --muted:#94a3b8;
            --green:#10b981;
        }

        body{
            margin:0;
            background: linear-gradient(
                135deg,
                #0f172a 0%,
                #111827 50%,
                #0f172a 100%
            );
            color:var(--text);
            min-height:100vh;
        }

        /* ==========================
           SIDEBAR
        ========================== */

        .sidebar{
            position:fixed;
            left:0;
            top:0;
            width:280px;
            height:100vh;

            background:rgba(17,24,39,.95);

            backdrop-filter:blur(12px);

            border-right:1px solid rgba(255,255,255,.08);

            padding:24px;

            display:flex;
            flex-direction:column;

            z-index:1000;
        }

        .logo-area{
            display:flex;
            align-items:center;
            gap:15px;

            margin-bottom:40px;
        }

        .logo-ct{
            width:55px;
            height:55px;
            border-radius:50%;
            object-fit:cover;
            background:white;
            padding:3px;
        }

        .logo-title{
            font-size:1.3rem;
            font-weight:700;
            color:white;
        }

        .menu{
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .menu a{
            color:#cbd5e1;
            text-decoration:none;

            padding:14px 18px;

            border-radius:14px;

            transition:.3s;
        }

        .menu a:hover{
            background:#1e293b;
            color:white;
        }

        .menu a.active{
            background:var(--green);
            color:white;
        }

        /* ==========================
           USER CARD
        ========================== */

        .user-card{
            margin-top:auto;

            background:#1e293b;

            border:1px solid rgba(255,255,255,.08);

            border-radius:18px;

            padding:18px;
        }

        .user-card h6{
            margin:0;
            color:white;
        }

        .user-card small{
            color:#94a3b8;
        }

        .logout-btn{
            width:100%;
            margin-top:15px;
        }

        /* ==========================
           CONTEÚDO
        ========================== */

        .main-content{
            margin-left:280px;
            padding:35px;
        }

        /* ==========================
           COMPONENTES GERAIS
        ========================== */

        .tabela-alunos{
            background:var(--card);
            border:1px solid rgba(255,255,255,.08);

            border-radius:20px;

            color:white;
        }

        .badge-faixa {
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .faixa-branca  {
            background-color:#f8f9fa;
            color:#000;
        }

        .faixa-cinza{
            background:#6c757d;
            color:#fff;
        }

        .faixa-amarela{
            background:#ffc107;
            color:#000;
        }

        .faixa-laranja{
            background:#fd7e14;
            color:#fff;
        }

        .faixa-verde{
            background:#198754;
            color:#fff;
        }

        .faixa-azul{
            background:#0d6efd;
            color:#fff;
        }

        .faixa-roxa{
            background:#6f42c1;
            color:#fff;
        }

        .faixa-marrom{
            background:#795548;
            color:#fff;
        }

        .faixa-preta{
            background:#212529;
            color:#fff;
        }

        @media(max-width:992px){

            .sidebar{
                width:100%;
                height:auto;
                position:relative;
            }

            .main-content{
                margin-left:0;
            }

        }

    </style>
</head>
<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo-area">

            <img src="{% static 'alunos/logo.png' %}" class="logo-ct">

            <div class="logo-title">
                Sistema de Graduação
            </div>

        </div>

        <nav class="menu">

            <a href="{% url 'inicio' %}" class="active">
                🏠 Painel Geral
            </a>

            <a href="{% url 'lista_alunos' %}">
                📋 Lista de Alunos
            </a>

            <a href="{% url 'lista_modalidades' %}">
                🥋 Modalidades
            </a>

            <a href="{% url 'lista_planos' %}">
                💳 Planos
            </a>

            <a href="{% url 'lista_competicoes' %}">
               🏆 Competicões
            </a>

        </nav>

        {% if user.is_authenticated %}
        <div class="user-card">

            <h6>CT Braga</h6>

            <small>Controle de Graduação</small>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn btn-outline-light logout-btn">
                    Sair
                </button>
            </form>

        </div>
        {% endif %}

    </aside>

    <!-- CONTEÚDO -->

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
